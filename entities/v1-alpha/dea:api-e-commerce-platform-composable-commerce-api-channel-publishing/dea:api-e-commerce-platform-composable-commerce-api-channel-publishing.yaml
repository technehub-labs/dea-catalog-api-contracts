name: 'Channel Publishing API Contract'
description: "Vendor-neutral API contract record specifying the request and response shape of the Channel Publishing Interface interaction boundary of the E Commerce Platform generic system class (commerce retail sector). The contract fixes the file transfer message shapes and constraints for internal application consumers under the batch interaction pattern; the boundary itself is owned by the Integration Interface catalogue record pinned for this population, which this contract specifies per the CR-021 D-4 disposition. The substitutability test passes: materially different vendor implementations can expose the same contract shape. At least 3 distinct vendor systems corroborate the shape as evidence only; no vendor product is canonical (per G-12)."
