description: "Vendor-neutral API contract record specifying the request and response shape of the Rolling Deployment Interface interaction boundary of the Container Orchestration Platform generic system class (technology infrastructure devops sector). The contract fixes the REST API message shapes and constraints for internal application consumers under the request-response interaction pattern; the boundary itself is owned by the Integration Interface catalogue record pinned for this population, which this contract specifies per the CR-021 D-4 disposition. The substitutability test passes: materially different vendor implementations can expose the same contract shape. At least 3 distinct vendor systems corroborate the shape as evidence only; no vendor product is canonical (per G-12)."
