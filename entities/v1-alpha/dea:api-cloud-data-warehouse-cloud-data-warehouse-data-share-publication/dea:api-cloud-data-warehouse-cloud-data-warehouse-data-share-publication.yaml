name: 'Data Share Publication API Contract'
description: "Vendor-neutral API contract record specifying the request and response shape of the Data Share Publication Interface interaction boundary of the Cloud Data Warehouse generic system class (data analytics sector). The contract fixes the message topic message shapes and constraints for external partner consumers under the event-subscribe interaction pattern; the boundary itself is owned by the Integration Interface catalogue record pinned for this population, which this contract specifies per the CR-021 D-4 disposition. The substitutability test passes: materially different vendor implementations can expose the same contract shape. At least 3 distinct vendor systems corroborate the shape as evidence only; no vendor product is canonical (per G-12)."
